<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小鹈鹕</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-left">
        <span class="hb"><span class="hb-dot" id="hb-dot"></span><span id="hb-text">Agent 离线</span></span>
        <span class="topbar-sep"></span>
        <span class="muted">最后心跳 <span id="hb-last">--</span></span>
      </div>
      <div class="topbar-right">
        <span class="pill" id="hb-level">主动级别 L2</span>
        <span class="pill" id="push-status" title="微信主动推送状态">微信推送 --</span>
        <button class="pill unread" id="unread-btn" title="查看对话">未读 <b id="unread-count">0</b></button>
      </div>
    </header>
    <div class="main">
      <aside class="sidebar">
        <div class="brand">
          <img src="/logo.png" alt="" />
          <span>小鹈鹕</span>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="sidebar-bottom" id="sidebar-bottom">
          <button class="nav-item nav-standalone" id="nav-settings">⚙️ 设置</button>
          <div class="sidebar-foot" id="sidebar-foot"></div>
        </div>
      </aside>
      <main class="content">
        <section id="view"></section>
      </main>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/src/vendor/qrcode.js"></script>
  <script type="module" src="/src/app.mjs"></script>
</body>
</html>
